<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Plan Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1b5e20;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1b5e20;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2e7d32;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FitBuddy AI</h1>

    <p class="subtitle">
        AI-Powered Personalized Fitness Plan Generator
    </p>

    <form action="/generate-workout" method="post">

        <label for="username">Name</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your name"
            required
        >

        <label for="user_id">User ID</label>
        <input
            type="text"
            id="user_id"
            name="user_id"
            placeholder="Enter your User ID"
            required
        >

        <label for="age">Age</label>
        <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
            min="13"
            required
        >

        <label for="weight">Weight (kg)</label>
        <input
            type="number"
            id="weight"
            name="weight"
            placeholder="Enter your weight"
            step="0.1"
            required
        >

        <label for="goal">Fitness Goal</label>
        <select id="goal" name="goal" required>
            <option value="">Select your goal</option>
            <option value="Weight Loss">Weight Loss</option>
            <option value="Muscle Gain">Muscle Gain</option>
            <option value="General Fitness">General Fitness</option>
            <option value="Flexibility">Flexibility</option>
            <option value="Strength">Strength</option>
        </select>

        <label for="intensity">Workout Intensity</label>
        <select id="intensity" name="intensity" required>
            <option value="">Select intensity</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button type="submit">
            Generate My Fitness Plan
        </button>

    </form>
    <div id="workout-result"></div>

<<div id="workout-result"></div>

<script>
document.querySelector("form").addEventListener("submit", async function(event) {
    event.preventDefault();

    const response = await fetch("/generate-workout", {
        method: "POST"
    });

    const data = await response.json();

    let html = `
        <h2>Your Workout Plan</h2>
    `;

    data.workout_plan.forEach(day => {
        html += `
            <div class="workout-day">
                <h3>${day.day} – ${day.title}</h3>
                <p>${day.description}</p>
            </div>
        `;
    });

    html += `
        <div class="feedback-section">
            <h2>Feedback</h2>
            <p>${data.feedback}</p>

            <h2>Your Updates</h2>
            <p>${data.your_updates}</p>

            <h2>Weekly Progress</h2>
            <p>${data.progress}</p>

            <h2>Next Steps</h2>
            <p>${data.next_steps}</p>
        </div>
    `;

    document.getElementById("workout-result").innerHTML = html;
});
</script>
</div>

</body>
</html>
